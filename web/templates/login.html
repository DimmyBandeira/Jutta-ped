<!doctype html>
<html lang="pt-br">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Entrar — Jutta Ped</title>
<link rel="stylesheet" href="/static/css/app.css">
</head>
<body>
<main style="max-width:380px; margin-top:12vh">
  <h2 style="text-align:center">Jutta Ped</h2>
  <p class="aviso" style="text-align:center">Monitoramento pediátrico</p>
  <form class="painel" method="post" action="/login">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    {% if erro %}<div class="badge offline" style="display:block; margin-bottom:.6rem">{{ erro }}</div>{% endif %}
    <label>Usuário</label>
    <input name="login" required autofocus autocapitalize="off" autocorrect="off">
    <label>Senha</label>
    <input name="senha" type="password" required>
    <div class="rodape-form"><button class="btn primary" type="submit" style="width:100%">Entrar</button></div>
  </form>
</main>
</body>
</html>
