<!doctype html>
<html lang="pt-br">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Entrar — Jutta Ped</title>
<link rel="stylesheet" href="/static/css/app.css">
</head>
<body class="sem-lateral">
<main id="conteudo">
  <h1 style="text-align:center; font-size:1.6rem; margin-bottom:.2rem">Jutta Ped</h1>
  <p class="aviso" style="text-align:center; margin-top:0">Monitoramento pediátrico</p>
  <form class="painel" method="post" action="/login">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    {% if erro %}<div class="mensagem erro" role="alert">{{ erro }}</div>{% endif %}
    <label for="l-login">Usuário</label>
    <input id="l-login" name="login" required autofocus autocapitalize="off" autocorrect="off">
    <label for="l-senha">Senha</label>
    <input id="l-senha" name="senha" type="password" required>
    <div class="rodape-form"><button class="btn primary" type="submit" style="width:100%">Entrar</button></div>
  </form>
</main>
</body>
</html>
