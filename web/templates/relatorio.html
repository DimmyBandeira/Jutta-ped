{% extends "base.html" %}
{% block title %}Alertas — Jutta Ped{% endblock %}
{% block titulo_pagina %}Alertas{% endblock %}
{% block content %}
<p class="subtitulo">Histórico dos alertas operacionais. Eventos de sombra (diagnóstico) não aparecem aqui.</p>
<form class="painel" id="filtros-relatorio" hx-get="/painel/relatorio/alertas" hx-target="#tabela-alertas" hx-trigger="change, load">
  <div class="linha">
    <div><label for="r-camera">Câmera</label>
      <select id="r-camera" name="camera_id"><option value="">Todas</option>{% for c in cameras or [] %}<option value="{{ c.id }}">{{ c.nome }}</option>{% endfor %}</select></div>
    <div><label for="r-situacao">Situação</label>
      <select id="r-situacao" name="situacao"><option value="">Todas</option><option value="pendente">Sem ciência</option><option value="reconhecido">Com ciência</option><option value="suprimido">Suprimidos (cooldown)</option></select></div>
    <div><label for="r-de">De</label><input id="r-de" type="date" name="de"></div>
    <div><label for="r-ate">Até</label><input id="r-ate" type="date" name="ate"></div>
  </div>
</form>
<div id="tabela-alertas" aria-live="polite"><div class="vazio">Carregando alertas…</div></div>
{% endblock %}
