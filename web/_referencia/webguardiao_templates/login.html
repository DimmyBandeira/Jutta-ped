<!doctype html>
<html lang="pt-br" class="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Entrar · {{ app_name }}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/static/css/app.css" />
</head>
<body class="min-h-screen bg-[#0b0f17] text-slate-200 flex items-center justify-center p-4">
  <div class="w-full max-w-sm">
    <div class="text-center mb-6">
      <div class="inline-flex items-center gap-2 justify-center">
        <span class="inline-block w-3 h-3 rounded-full bg-cyan-400 shadow-[0_0_14px] shadow-cyan-400"></span>
        <span class="text-lg font-semibold tracking-wide">{{ app_name }}</span>
      </div>
      <p class="text-xs text-slate-400 mt-1">Sistema de monitoramento</p>
    </div>

    <form method="post" action="/login"
          class="bg-[#111827] border border-[#243044] rounded-2xl p-6 shadow-xl space-y-4">
      {% if error %}
      <div class="text-sm rounded-lg bg-red-500/10 border border-red-500/30 text-red-300 px-3 py-2">
        {{ error }}
      </div>
      {% endif %}

      <div>
        <label class="block text-xs text-slate-400 mb-1">Usuário</label>
        <input name="username" autofocus required
               class="w-full px-3 py-2 rounded-lg bg-[#0b0f17] border border-[#243044] focus:border-cyan-500 outline-none" />
      </div>
      <div>
        <label class="block text-xs text-slate-400 mb-1">Senha</label>
        <input name="password" type="password" required
               class="w-full px-3 py-2 rounded-lg bg-[#0b0f17] border border-[#243044] focus:border-cyan-500 outline-none" />
      </div>

      <button class="w-full py-2.5 rounded-lg bg-cyan-600 hover:bg-cyan-500 font-medium transition">
        Entrar
      </button>
    </form>
    <p class="text-center text-[11px] text-slate-500 mt-4">WebGuardião Core · MVP</p>
  </div>
</body>
</html>
