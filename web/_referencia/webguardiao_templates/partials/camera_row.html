<tr id="camera-row-{{ camera.id }}" class="hover:bg-ink-700/40">
  <td class="px-4 py-3 font-medium">{{ camera.name }}</td>
  <td class="px-4 py-3 text-slate-400">
    {{ camera.manufacturer.name if camera.manufacturer else 'Genérico' }}
  </td>
  <td class="px-4 py-3 text-slate-400">{{ camera.host }}:{{ camera.port }}</td>
  <td class="px-4 py-3 text-slate-400">{{ camera.channel }}</td>
  <td class="px-4 py-3">
    {% if camera.go2rtc_stream_name %}
      <div class="flex items-center gap-2 flex-wrap">
        <span class="text-xs px-2 py-0.5 rounded bg-cyan-600/20 text-cyan-300">
          {{ camera.go2rtc_stream_name }}
        </span>
        <button hx-get="/cameras/{{ camera.id }}/test-stream"
                hx-target="#stream-status-row-{{ camera.id }}"
                hx-swap="innerHTML"
                hx-disabled-elt="this"
                class="text-xs px-1.5 py-0.5 rounded bg-ink-700 hover:bg-ink-600 transition">
          Testar
        </button>
        <span id="stream-status-row-{{ camera.id }}"></span>
      </div>
    {% else %}
      <span class="text-xs text-slate-600">—</span>
    {% endif %}
  </td>
  <td class="px-4 py-3">
    <button hx-post="/cameras/{{ camera.id }}/toggle-active"
            hx-target="#camera-row-{{ camera.id }}" hx-swap="outerHTML"
            class="text-xs px-2 py-1 rounded-lg
                   {{ 'bg-emerald-500/15 text-emerald-300' if camera.is_active else 'bg-slate-600/30 text-slate-400' }}">
      {{ 'Ativo' if camera.is_active else 'Inativo' }}
    </button>
  </td>
  <td class="px-4 py-3 text-right whitespace-nowrap">
    <button hx-get="/cameras/{{ camera.id }}/edit" hx-target="#modal" hx-swap="innerHTML"
            onclick="openModal()"
            class="text-xs px-2 py-1 rounded-lg bg-ink-700 hover:bg-ink-600">Editar</button>
    <form method="post" action="/cameras/{{ camera.id }}/delete" class="inline"
          onsubmit="return confirm('Excluir esta câmera?')">
      <button class="text-xs px-2 py-1 rounded-lg bg-red-600/20 text-red-300 hover:bg-red-600/30">
        Excluir
      </button>
    </form>
  </td>
</tr>
